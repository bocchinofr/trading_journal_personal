      <button onClick={onAddTrade} style={{ margin: '0 0 16px', padding: '12px 14px', borderRadius: 8, border: `1px solid ${C.accent}55`, background: `${C.accent}15`, color: C.accent, fontWeight: 800, fontSize: 14, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }}>＋ Aggiungi trade</button>
      {TAB_ITEMS.map(([key, icon, label]) => (
        <button key={key} onClick={() => setTab(key)} style={{ display: 'flex', alignItems: 'center', gap: 12, textAlign: 'left', padding: '11px 12px', borderRadius: 8, cursor: 'pointer', fontSize: 15, fontWeight: 700, border: 'none', background: tab === key ? `${C.accent}18` : 'transparent', color: tab === key ? C.accent : C.muted }}>
          <span style={{ fontSize: 17 }}>{icon}</span><span>{label}</span>
        </button>
      ))}
      <div style={{ flex: 1 }} />
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, paddingTop: 14, borderTop: `1px solid ${C.border}` }}>
        <button onClick={toggleTheme} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', borderRadius: 8, border: `1px solid ${C.border}`, background: C.card2, color: C.text, fontSize: 14, fontWeight: 700, cursor: 'pointer' }}>{theme === 'dark' ? '☀️ Tema chiaro' : '🌙 Tema scuro'}</button>
        <button onClick={onExport} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', borderRadius: 8, border: `1px solid ${C.border}`, background: C.card2, color: C.text, fontSize: 14, fontWeight: 700, cursor: 'pointer' }}>⬇ Export JSON</button>
      </div>
    </div>
  );
}

function MobileMenu({ tab, setTab, theme, toggleTheme, onExport, onAddTrade, onClose }) {
  return (
    <div onClick={e => { if (e.target === e.currentTarget) onClose(); }} style={{ position: 'fixed', inset: 0, zIndex: 500, background: 'rgba(0,0,0,0.6)', display: 'flex', justifyContent: 'flex-end' }}>
      <div style={{ width: '78%', maxWidth: 300, height: '100%', background: C.card, borderLeft: `1px solid ${C.border}`, padding: 18, display: 'flex', flexDirection: 'column', gap: 4, overflowY: 'auto' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <span style={{ fontWeight: 800, fontSize: 17, color: C.text }}>📓 Menu</span>
          <span onClick={onClose} style={{ cursor: 'pointer', color: C.muted, fontSize: 22, padding: 4 }}>✕</span>
        </div>
        <button onClick={() => { onAddTrade(); onClose(); }} style={{ margin: '0 0 14px', padding: '12px 14px', borderRadius: 8, border: `1px solid ${C.accent}55`, background: `${C.accent}15`, color: C.accent, fontWeight: 800, fontSize: 15, cursor: 'pointer' }}>＋ Aggiungi trade</button>
        {TAB_ITEMS.map(([key, icon, label]) => (
          <button key={key} onClick={() => { setTab(key); onClose(); }} style={{ display: 'flex', alignItems: 'center', gap: 12, textAlign: 'left', padding: '12px 12px', borderRadius: 8, cursor: 'pointer', fontSize: 15, fontWeight: 700, border: 'none', background: tab === key ? `${C.accent}18` : 'transparent', color: tab === key ? C.accent : C.muted }}>
            <span style={{ fontSize: 17 }}>{icon}</span><span>{label}</span>
          </button>
        ))}
        <div style={{ flex: 1 }} />
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, paddingTop: 14, borderTop: `1px solid ${C.border}` }}>
          <button onClick={toggleTheme} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '11px', borderRadius: 8, border: `1px solid ${C.border}`, background: C.card2, color: C.text, fontSize: 14, fontWeight: 700, cursor: 'pointer' }}>{theme === 'dark' ? '☀️ Tema chiaro' : '🌙 Tema scuro'}</button>
          <button onClick={() => { onExport(); onClose(); }} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '11px', borderRadius: 8, border: `1px solid ${C.border}`, background: C.card2, color: C.text, fontSize: 14, fontWeight: 700, cursor: 'pointer' }}>⬇ Export JSON</button>
        </div>
      </div>
    </div>
  );
}

function TradingJournal() {
  const [trades, setTrades] = useState([]);
  const [reviews, setReviews] = useState({});
  const [pendingNotes, setPendingNotes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedDay, setSelectedDay] = useState(null);
  const [calendarView, setCalendarView] = useState('month');
  const [calendarCursor, setCalendarCursor] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const [tab, setTab] = useState('calendar');
  const [filters, setFilters] = useState({
      dateFrom: '', dateTo: '', tags: [], ticker: '',
      side: '', weekdays: [], priceBuckets: [], timeBuckets: [],
      entryTags: [], eventTags: [],
    });
  const [theme, setTheme] = useState('dark');
  const [isDesktop, setIsDesktop] = useState(() => typeof window !== 'undefined' ? window.innerWidth >= 820 : true);
  const [isWide, setIsWide] = useState(() => typeof window !== 'undefined' ? window.innerWidth >= 1300 : true);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [addFormOpen, setAddFormOpen] = useState(false);

  useEffect(() => {
    const onResize = () => {
      setIsDesktop(window.innerWidth >= 820);
      setIsWide(window.innerWidth >= 1300);
    };
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  applyTheme(theme);

  const toggleTheme = async () => { const next = theme === 'dark' ? 'light' : 'dark'; setTheme(next); await dataStore.saveTheme(next); };

  const filteredTrades = useMemo(() => {
    return trades.filter(t => {
      if (filters.dateFrom && t.date < filters.dateFrom) return false;
      if (filters.dateTo && t.date > filters.dateTo) return false;
      if (filters.tags && filters.tags.length && !filters.tags.some(tag => getTags(t).includes(tag))) return false;
      if (filters.ticker && !t.ticker.includes(filters.ticker)) return false;
      if (filters.side) {
        const s = t.side === 'short' ? 'Short' : t.side === 'long' ? 'Long' : '';
        if (s !== filters.side) return false;
      }
      if (filters.weekdays && filters.weekdays.length) {
        const wd = WEEKDAY_NAMES[(new Date(t.date + 'T00:00:00').getDay() + 6) % 7];
        if (!filters.weekdays.includes(wd)) return false;
      }
      if (filters.priceBuckets && filters.priceBuckets.length) {
        if (t.entryPrice == null || !filters.priceBuckets.includes(priceBucket(t.entryPrice))) return false;
      }
      if (filters.timeBuckets && filters.timeBuckets.length) {
        if (!t.time || !filters.timeBuckets.includes(tradeTimeBucket(t))) return false;
      }
      if (filters.entryTags && filters.entryTags.length) {
        const et = t.journal?.entryTags || [];
        if (!filters.entryTags.some(tag => et.includes(tag))) return false;
      }
      if (filters.eventTags && filters.eventTags.length) {
        const ev = t.journal?.eventTags || [];
        if (!filters.eventTags.some(tag => ev.includes(tag))) return false;
      }
      return true;
    });
  }, [trades, filters]);

  const ctCount = filteredTrades.filter(t => getTags(t).includes(CT_TAG)).length;
  CUR = (ctCount > 0 && ctCount === filteredTrades.length) ? '€' : '$';
  const mixedCurrency = ctCount > 0 && ctCount < filteredTrades.length;

  useEffect(() => {
    Promise.all([dataStore.getTrades(), dataStore.getReviews(), dataStore.getPendingNotes(), dataStore.getTheme()]).then(([t, r, n, th]) => {
      setTrades(t); setReviews(r); setPendingNotes(n); setTheme(th); setLoading(false);
    });
  }, []);

  const addPendingNote = useCallback(async (note) => { const updated = [...pendingNotes, note]; setPendingNotes(updated); await dataStore.savePendingNotes(updated); }, [pendingNotes]);
  const deletePendingNote = useCallback(async (id) => { const updated = pendingNotes.filter(n => n.id !== id); setPendingNotes(updated); await dataStore.savePendingNotes(updated); }, [pendingNotes]);
  const saveReview = useCallback(async (weekKey, review) => { const updated = { ...reviews, [weekKey]: review }; setReviews(updated); await dataStore.saveReviews(updated); }, [reviews]);
  const addTrade = useCallback(async (trade) => { const updated = [...trades, trade]; setTrades(updated); await dataStore.saveTrades(updated); }, [trades]);
  const updateTrade = useCallback(async (trade) => { const updated = trades.map(t => t.id === trade.id ? trade : t); setTrades(updated); await dataStore.saveTrades(updated); }, [trades]);
  const deleteTrade = useCallback(async (id) => { const updated = trades.filter(t => t.id !== id); setTrades(updated); await dataStore.saveTrades(updated); }, [trades]);
  const duplicateTrade = useCallback(async (trade) => { const copy = { ...trade, id: uuid() }; const updated = [...trades, copy]; setTrades(updated); await dataStore.saveTrades(updated); }, [trades]);

  const allTags = useMemo(() => {
    const s = new Set();
    trades.forEach(t => getTags(t).forEach(tag => s.add(tag)));
    return Array.from(s).sort();
  }, [trades]);

  const importTrades = useCallback(async (newTrades, usedNoteIds = []) => {
    const updated = [...trades, ...newTrades];
    setTrades(updated);
    await dataStore.saveTrades(updated);
    if (usedNoteIds.length) {
      const updatedNotes = pendingNotes.map(n => usedNoteIds.includes(n.id) ? { ...n, used: true } : n);
      setPendingNotes(updatedNotes);
      await dataStore.savePendingNotes(updatedNotes);
    }
  }, [trades, pendingNotes]);


  const [showExportModal, setShowExportModal] = useState(false);
  const exportJsonContent = useMemo(() => JSON.stringify({ trades, reviews, pendingNotes }, null, 2), [trades, reviews, pendingNotes]);

  const dayTrades = selectedDay ? filteredTrades.filter(t => t.date === selectedDay) : [];
  const openAddForm = () => setAddFormOpen(true);

  if (loading) return <div style={{ color: C.muted, padding: 30, background: C.bg }}>Caricamento…</div>;

  const shellStyle = isDesktop
    ? { background: C.bg, height: '100vh', overflow: 'hidden', fontFamily: 'system-ui, sans-serif', display: 'flex', flexDirection: 'row' }
    : { background: C.bg, minHeight: '100vh', fontFamily: 'system-ui, sans-serif', display: 'flex', flexDirection: 'column' };

  const mainStyle = isDesktop
    ? { flex: 1, minWidth: 0, height: '100vh', display: 'flex', flexDirection: 'column', overflow: 'hidden' }
    : { flex: 1, minWidth: 0, padding: 18, display: 'flex', flexDirection: 'column', gap: 16 };

  const contentStyle = isDesktop
    ? { flex: 1, minHeight: 0, overflowY: 'auto', padding: '16px 28px 24px', display: 'flex', flexDirection: 'column', gap: 14 }
    : { display: 'flex', flexDirection: 'column', gap: 16 };

  return (
    <div style={shellStyle}>

      {isDesktop && (<Sidebar tab={tab} setTab={setTab} theme={theme} toggleTheme={toggleTheme} onExport={() => setShowExportModal(true)} onAddTrade={openAddForm} />)}

      <div style={mainStyle}>

        {!isDesktop && (
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
            <div style={{ fontWeight: 800, fontSize: 17, color: C.text, minWidth: 0 }}>
              {TAB_ITEMS.find(([k]) => k === tab)?.[1]} {TAB_ITEMS.find(([k]) => k === tab)?.[2]}
            </div>
            <div style={{ display: 'flex', gap: 8, flexShrink: 0 }}>
              <button onClick={openAddForm} style={{ padding: '9px 13px', borderRadius: 8, border: `1px solid ${C.accent}55`, background: `${C.accent}15`, color: C.accent, fontSize: 14, fontWeight: 800, cursor: 'pointer' }}>＋ Trade</button>
              <button onClick={() => setMobileMenuOpen(true)} title="Menu" style={{ padding: '9px 13px', borderRadius: 8, border: `1px solid ${C.border}`, background: C.card2, color: C.text, fontSize: 17, cursor: 'pointer', lineHeight: 1 }}>☰</button>
            </div>
          </div>
        )}

        {!isDesktop && mobileMenuOpen && (<MobileMenu tab={tab} setTab={setTab} theme={theme} toggleTheme={toggleTheme} onExport={() => setShowExportModal(true)} onAddTrade={openAddForm} onClose={() => setMobileMenuOpen(false)} />)}

        {isDesktop && (
          <div style={{ padding: '20px 28px 0' }}>
            <div style={{ fontWeight: 800, fontSize: 22, color: C.text, letterSpacing: '-0.01em' }}>
              {TAB_ITEMS.find(([k]) => k === tab)?.[1]} {TAB_ITEMS.find(([k]) => k === tab)?.[2]}
            </div>
          </div>
        )}

        <div style={contentStyle}>

          {showExportModal && (<ExportModal title="📦 Export completo (trade + revisioni)" content={exportJsonContent} filename={`trading-journal-${Date.now()}.json`} mime="application/json" onClose={() => setShowExportModal(false)} />)}

          {addFormOpen && (<AddTradeForm onAddTrade={addTrade} onAddNote={addPendingNote} allTags={allTags} onClose={() => setAddFormOpen(false)} isDesktop={isDesktop} />)}

          <KpiStrip trades={filteredTrades} isDesktop={isDesktop} />

          {tab !== 'import' && (<FilterBar trades={trades} filters={filters} setFilters={setFilters} />)}

          {tab !== 'import' && mixedCurrency && (
            <div style={{ background: C.yellow + '14', border: '1px solid ' + C.yellow + '55', borderRadius: 10, padding: '9px 14px', fontSize: 13, color: C.yellow }}>
              ⚠ Stai sommando conti in valute diverse ($ e €). Seleziona un Tag / Conto per statistiche corrette.
            </div>
          )}

          {tab === 'calendar' && (
            <>
              <div style={{ display: 'flex', gap: 6 }}>
                {[['month', '📅 Mese'], ['year', '🗓 Anno']].map(([v, l]) => (
                  <button key={v} onClick={() => setCalendarView(v)} style={{ padding: '7px 16px', borderRadius: 6, cursor: 'pointer', fontSize: 13, fontWeight: 700, border: `1px solid ${calendarView === v ? C.accent : C.border}`, background: calendarView === v ? `${C.accent}15` : C.card2, color: calendarView === v ? C.accent : C.muted }}>{l}</button>
                ))}
              </div>
              {calendarView === 'month' ? (
                <>
                  <div style={{ display: 'grid', gridTemplateColumns: isWide ? 'minmax(0, 1fr) 360px' : '1fr', gap: 20, alignItems: 'start' }}>
                    <MonthCalendar trades={filteredTrades} onDayClick={setSelectedDay} isDesktop={isDesktop} cursor={calendarCursor} setCursor={setCalendarCursor} />
                    {isDesktop && (<LastMonthsSidebar trades={filteredTrades} onDayClick={setSelectedDay} />)}
                  </div>
                  {selectedDay && (
                    <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: 18, maxWidth: 720 }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 10 }}>
                        <span style={{ fontSize: 14, fontWeight: 700, color: C.accent }}>Trade del {selectedDay}</span>
                        <span onClick={() => setSelectedDay(null)} style={{ color: C.muted, cursor: 'pointer', fontSize: 14 }}>✕</span>
                      </div>
                      {dayTrades.map(t => (
                        <div key={t.id} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 14, padding: '7px 0', borderBottom: `1px solid ${C.border}` }}>
                          <span style={{ color: C.text, fontWeight: 700 }}>{t.ticker}</span>
                          <span style={{ color: C.muted }}>{getTags(t).join(', ')}</span>
                          <span style={{ color: t.pnl >= 0 ? C.profit : C.loss, fontFamily: 'monospace', fontWeight: 700 }}>{fmt$(t.pnl)}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </>
              ) : (<YearView trades={filteredTrades} onDayClick={setSelectedDay} />)}
            </>
          )}

          {tab === 'log' && (<TradeLog trades={filteredTrades} onUpdate={updateTrade} onDelete={deleteTrade} onDuplicate={duplicateTrade} allTags={allTags} isDesktop={isDesktop} />)}
          {tab === 'review' && (<WeeklyReview trades={filteredTrades} reviews={reviews} onSaveReview={saveReview} isDesktop={isDesktop} />)}
          {tab === 'strategy' && (<StrategyView trades={filteredTrades} />)}
          {tab === 'report' && (<ReportPanel trades={filteredTrades} reviews={reviews} />)}
          {tab === 'import' && (<ImportPanel existingTrades={trades} onImport={importTrades} pendingNotes={pendingNotes} onDeleteNote={deletePendingNote} />)}

        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <PasswordGate><TradingJournal /></PasswordGate>
);
</script>
</body>
</html>
