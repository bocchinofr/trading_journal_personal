function PasswordGate({ children }) {
  const [unlocked, setUnlocked] = useState(() => sessionStorage.getItem('journal-unlocked') === '1');
  const [input, setInput] = useState('');
  const [err, setErr] = useState(false);

  if (unlocked) return children;

  const tryUnlock = () => {
    if (input === JOURNAL_PASSWORD) {
      sessionStorage.setItem('journal-unlocked', '1');
      setUnlocked(true);
    } else {
      setErr(true);
    }
  };

  return (
    <div style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#0a0f16' }}>

          onKeyDown={e => e.key === 'Enter' && tryUnlock()}

function uuid() {
  if (window.crypto && typeof window.crypto.randomUUID === 'function') {
    try { return window.crypto.randomUUID(); } catch (e) {}
  }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function getMonday(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return d.toISOString().slice(0, 10);
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function formatWeekRange(mondayStr) {
  const d1 = new Date(mondayStr + 'T00:00:00');
  const d2 = new Date(addDays(mondayStr, 6) + 'T00:00:00');
  return `${d1.getDate()} ${monthNames[d1.getMonth()]} → ${d2.getDate()} ${monthNames[d2.getMonth()]}`;
}

function parseCSV(text) {
  const lines = text.replace(/^\uFEFF/, '').replace(/\r/g, '').split('\n').filter(l => l.trim().length > 0);
  if (!lines.length) return [];
  const splitLine = line => {
    const out = []; let cur = ''; let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') inQuotes = !inQuotes;
      else if (ch === ',' && !inQuotes) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out;
  };
  const headers = splitLine(lines[0]).map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = splitLine(line);
    const row = {};
    headers.forEach((h, i) => { row[h] = (vals[i] ?? '').trim(); });
    return row;
  });
}
function tzDate(mmddyyyy) {
  const [m, d, y] = mmddyyyy.split('/');
  return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
}

function buildRoundTripsFromTradeHistory(rows) {
  const groups = {};
  rows.forEach(r => {
    if (!r.Symbol || !r['T/D']) return;
    const key = `${r.Symbol}__${r['T/D']}`;
    (groups[key] = groups[key] || []).push(r);
  });

  const trips = [];
  Object.values(groups).forEach(fills => {
    fills.sort((a, b) => a['Exec Time'].localeCompare(b['Exec Time']));
    let position = 0;
    let current = null;

    fills.forEach(f => {
      const qty = Number(f.Qty);
      const price = Number(f.Price);
      const net = Number(f['Net Proceeds']);
      const comm = (Number(f.Comm)||0) + (Number(f.SEC)||0) + (Number(f.TAF)||0) + (Number(f.NSCC)||0) + (Number(f.Nasdaq)||0);
      const isSell = f.Side === 'S' || f.Side === 'SS';
      const delta = isSell ? -qty : qty;

      if (position === 0 && !current) {
        current = {
          symbol: f.Symbol,
          date: tzDate(f['T/D']),
          side: isSell ? 'short' : 'long',
          entryFills: [], exitFills: [],
          pnlFromProceeds: 0, totalComm: 0,
          firstTime: f['Exec Time'],
        };
      }
      const openDirectionIsSell = current.side === 'short';
      const isOpeningFill = isSell === openDirectionIsSell;
      (isOpeningFill ? current.entryFills : current.exitFills).push({ qty, price, net });
      current.pnlFromProceeds += net;
      current.totalComm += comm;
      position += delta;

      if (position === 0) {
        const sumQtyPrice = arr => arr.reduce((s, x) => s + x.qty * x.price, 0);
        const sumQty = arr => arr.reduce((s, x) => s + x.qty, 0);
        const entryQty = sumQty(current.entryFills);
        const exitQty = sumQty(current.exitFills);
        trips.push({
          ticker: current.symbol,
          date: current.date,
          side: current.side,
          entryPrice: entryQty ? sumQtyPrice(current.entryFills) / entryQty : null,
          exitPrice: exitQty ? sumQtyPrice(current.exitFills) / exitQty : null,
          qty: entryQty,
          pnlFromProceeds: current.pnlFromProceeds,
          commission: current.totalComm,
          time: current.firstTime,
        });
        current = null;
      }
    });
    if (current) {
      const sumQtyPrice = arr => arr.reduce((s, x) => s + x.qty * x.price, 0);
      const sumQty = arr => arr.reduce((s, x) => s + x.qty, 0);
      const entryQty = sumQty(current.entryFills);
      const exitQty = sumQty(current.exitFills);
      trips.push({
        ticker: current.symbol,
        date: current.date,
        side: current.side,
        entryPrice: entryQty ? sumQtyPrice(current.entryFills) / entryQty : null,
        exitPrice: exitQty ? sumQtyPrice(current.exitFills) / exitQty : null,
        qty: entryQty,
        pnlFromProceeds: current.pnlFromProceeds,
        time: current.firstTime,
        commission: current.totalComm,
        openPosition: true,
      });
    }
  });
  return trips;
}

const CT_TAG = 'Import cTrader';
const TZ_TAG = 'Import TradeZero';

function parseLooseNumber(v) {
  let x = String(v == null ? '' : v).replace(/[\s\u00a0\u202f]/g, '').replace(/[^0-9,.\-]/g, '');
  if (!x) return 0;
  if (x.lastIndexOf(',') > x.lastIndexOf('.')) x = x.replace(/\./g, '').replace(',', '.');
  else x = x.replace(/,/g, '');
  const n = Number(x);
  return isNaN(n) ? 0 : n;
}
function ctCol(row, prefix) {
  const k = Object.keys(row).find(h => h.replace(/^\uFEFF/, '').toLowerCase().startsWith(prefix.toLowerCase()));
  return k ? row[k] : '';
}
function isCTraderCSV(rows) {
  if (!rows || !rows.length) return false;
  const keys = Object.keys(rows[0]).map(k => k.replace(/^\uFEFF/, '').toLowerCase());
  return keys.some(k => k.startsWith('simbolo')) && keys.some(k => k.startsWith('orario di chiusura'));
}

function ctDate(s) {
  const m = String(s || '').match(/(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2}):(\d{2})/);
  return m ? Date.UTC(+m[3], +m[2] - 1, +m[1], +m[4], +m[5], +m[6]) : null;
}

function ctTime(s) {
  const m = String(s || '').match(/ (\d{2}):(\d{2}):(\d{2})/);
  return m ? m[1] + ':' + m[2] + ':' + m[3] : null;
}
function fmtDur(sec) {
  if (sec == null) return '';
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60);
  return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0');
}

function buildTripsFromCTrader(rows) {
  const out = [];
  rows.forEach(r => {
    const sym = ctCol(r, 'Simbolo');
    const when = ctCol(r, 'Orario di chiusura');
    const openStr = ctCol(r, 'Orario di apertura');
    if (!sym || !when) return;
    const parts = when.trim().split(' ');
    const dmy = (parts[0] || '').split('/');
    if (dmy.length !== 3) return;
    const date = dmy[2] + '-' + dmy[1].padStart(2, '0') + '-' + dmy[0].padStart(2, '0');
    const dir = ctCol(r, 'Direzione').trim().toLowerCase();
    const side = (dir.startsWith('buy') || dir.startsWith('acq')) ? 'long' : 'short';
    const lots = parseLooseNumber(ctCol(r, 'Quantit'));
    const pips = ctCol(r, 'Pip');
    const t0 = ctDate(openStr), t1 = ctDate(when);
    out.push({
      ticker: sym.trim().toUpperCase(),
      date, side,
      entryPrice: parseLooseNumber(ctCol(r, 'Prezzo di entrata')),
      exitPrice: parseLooseNumber(ctCol(r, 'Prezzo di chiusura')),
      qty: lots,
      pnlFromProceeds: parseLooseNumber(ctCol(r, 'Netto')),
      commission: Math.abs(parseLooseNumber(ctCol(r, 'Commissione'))),
      swap: -parseLooseNumber(ctCol(r, 'Swap')),   // costo positivo, credito negativo
      time: ctTime(openStr),
      exitTime: ctTime(when),
      durationSec: (t0 != null && t1 != null) ? Math.round((t1 - t0) / 1000) : null,
      sortTime: (openStr.split(' ')[1]) || '99:99',
      pips: pips !== '' ? parseLooseNumber(pips) : null,
    });
  });
  return out;
}

function buildLocateCostMap(rows) {
  const map = {};
  rows.forEach(r => {
    if (r.Type !== 'Locate Fees' || !r.Note) return;
    const m = r.Note.match(/Locate(?: credit)? \d+ ([A-Z]+) @/);
    if (!m) return;
    const ticker = m[1];
    const date = tzDate(r['E/D']);
    const key = `${date}__${ticker}`;
    const withdraw = Number(r.Withdraw) || 0;
    const deposit = Number(r.Deposit) || 0;
    map[key] = (map[key] || 0) + withdraw - deposit;
  });
  return map;
}

function getLocateCost(t) {
  if (typeof t.locateCost === 'number') return t.locateCost;
  if (t.notes) {
    const m = t.notes.match(/Locate: -([\d.]+)\$/);
    if (m) return Number(m[1]);
  }
  return 0;
}
function getCommission(t) {
  return typeof t.commission === 'number' ? t.commission : 0;
}

function getSize(t) {
  if (typeof t.size === 'number') return t.size;
  if (t.notes) { const m = t.notes.match(/([\d.,]+) lotti/); if (m) return parseLooseNumber(m[1]); }
  return null;
}
function getPips(t) {
  if (typeof t.pips === 'number') return t.pips;
  if (t.notes) { const m = t.notes.match(/(-?[\d.,]+) pip/); if (m) return parseLooseNumber(m[1]); }
  return null;
}
function fmtSize(t) {
  const s = getSize(t);
  if (s == null) return '—';
  return getTags(t).includes(CT_TAG) ? (Math.round(s * 100) / 100) + ' lot' : Math.round(s).toLocaleString('it-IT') + ' sh';
}
function fmtPips(t) {
  const p = getPips(t);
  return p == null ? '—' : (p >= 0 ? '+' : '') + p.toFixed(1);
}

function isWin(t) {
  return (t.pnl + getCommission(t)) > 0;
}

// ─────────────────────────────────────────────────────────────
// DEFINIZIONE DEL "TRIANGOLO GIALLO ⚠️"
// Il triangolo appare su un trade quando ha almeno un tag di
// esecuzione che NON è tra quelli positivi. I tag positivi sono
// 'Buon trade' e 'Piano rispettato'. Tutti gli altri tag evento
// (Uscito presto, Uscito tardi, Distratto, Troppa size, Poca size,
// Overtrading) segnalano un problema di esecuzione.
// ─────────────────────────────────────────────────────────────
const POSITIVE_EVENT_TAGS = ['Buon trade', 'Piano rispettato'];
function getWarningTags(t) {
  if (!t.journal?.eventTags?.length) return [];
  return t.journal.eventTags.filter(e => !POSITIVE_EVENT_TAGS.includes(e));
}

// ════════════════════════════════════════════════════════════
// KPI STRIP
// ════════════════════════════════════════════════════════════
function KpiStrip({ trades, isDesktop }) {
  const stats = useMemo(() => {
    const n = trades.length;
    const wins = trades.filter(isWin);
    const losses = trades.filter(t => !isWin(t));
    const totalPnl = trades.reduce((s, t) => s + t.pnl, 0);
    const winrate = n ? wins.length / n : 0;
    const avgWin = wins.length ? wins.reduce((s, t) => s + t.pnl, 0) / wins.length : 0;
    const avgLoss = losses.length ? Math.abs(losses.reduce((s, t) => s + t.pnl, 0) / losses.length) : 0;
    const expectancy = n ? totalPnl / n : 0;
    const pf = avgLoss > 0 && losses.length ? (avgWin * wins.length) / (avgLoss * losses.length) : 0;

    const sorted = [...trades].sort((a, b) => a.pnl - b.pnl);
    const worst = sorted[0];
    const best = sorted[sorted.length - 1];

    const byDate = [...trades].sort((a, b) => a.date.localeCompare(b.date));
    let cum = 0, peak = 0, isNewHigh = false;
    let curWin = 0, curLoss = 0, maxWinStreak = 0, maxLossStreak = 0;
    byDate.forEach((t, i) => {
      cum += t.pnl;
      if (cum > peak) peak = cum;
      if (i === byDate.length - 1) isNewHigh = n > 0 && cum >= peak;
      if (isWin(t)) { curWin++; curLoss = 0; maxWinStreak = Math.max(maxWinStreak, curWin); }
      else { curLoss++; curWin = 0; maxLossStreak = Math.max(maxLossStreak, curLoss); }
    });
    // streak corrente = ultima serie consecutiva (win o loss) fino ad oggi
    let currentStreak = 0, currentStreakType = null;
    for (let i = byDate.length - 1; i >= 0; i--) {
      const winFlag = isWin(byDate[i]);
      if (currentStreakType === null) { currentStreakType = winFlag; currentStreak = 1; }
      else if (winFlag === currentStreakType) { currentStreak++; }
      else break;
    }

    return {
      n, totalPnl, winrate, expectancy, pf, avgWin, avgLoss, best, worst,
      maxWinStreak, maxLossStreak, winsCount: wins.length, lossesCount: losses.length,
      isNewHigh, currentStreak, currentStreakType,
    };
  }, [trades]);

  const lowData = stats.n < 20;
  const badgeStyle = color => ({
    display: 'inline-block', fontSize: 10, fontWeight: 700,
    padding: '2px 7px', borderRadius: 10, marginTop: 6,
    background: `${color}1f`, color, border: `1px solid ${color}4d`,
  });

  const mainCards = [
    {
      label: 'P&L totale', val: fmt$(stats.totalPnl), color: stats.totalPnl >= 0 ? C.profit : C.loss,
      badge: stats.isNewHigh && stats.n > 0 ? { text: '● Nuovo massimo', color: C.profit } : null,
    },
    {
      label: 'Winrate', val: `${(stats.winrate * 100).toFixed(0)}%`, color: stats.winrate >= 0.5 ? C.profit : C.loss,
      badge: lowData ? { text: `◐ Pochi dati (${stats.n})`, color: C.yellow } : null,
    },
    { label: 'Expectancy', val: fmt$(stats.expectancy), color: C.text, badge: null },
    {
      label: 'Profit factor', val: stats.pf.toFixed(2), color: stats.pf >= 1.5 ? C.profit : C.loss,
      badge: stats.pf < 1.2 ? { text: '▼ Sotto soglia', color: C.loss }
        : stats.pf >= 1.5 ? { text: '● Solido', color: C.profit } : null,
    },
  ];

  const streakLabel = stats.currentStreak

function MonthCalendar({ trades, onDayClick, isDesktop, cursor, setCursor }) {
  const dayData = useMemo(() => {
    const map = {};
    trades.forEach(t => {
      const key = t.date;
      if (!map[key]) map[key] = { pnl: 0, count: 0, hasWarning: false };
      map[key].pnl += t.pnl;
      map[key].count += 1;
      if (getWarningTags(t).length > 0) map[key].hasWarning = true;
    });
    return map;
  }, [trades]);

  const first = new Date(cursor.y, cursor.m, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(cursor.y, cursor.m + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const monthTotal = Object.entries(dayData)
    .filter(([k]) => k.startsWith(`${cursor.y}-${String(cursor.m + 1).padStart(2, '0')}`))
    .reduce((s, [, v]) => s + v.pnl, 0);

  const intensity = pnl => C.calMin + Math.min(Math.abs(pnl) / 300, 1) * C.calRange;

  return (
    <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: isDesktop ? 22 : 14 }}>

        <div style={{ textAlign: 'center' }}>
          <div style={{ fontWeight: 800, fontSize: isDesktop ? 22 : 17, color: C.text }}>{monthNames[cursor.m]} {cursor.y}</div>
          <div style={{ fontSize: isDesktop ? 17 : 14, fontFamily: 'monospace', color: monthTotal >= 0 ? C.profit : C.loss, marginTop: 3, fontWeight: 700 }}>{fmt$(monthTotal)}</div>

      </div>

        {dayLabels.map((d, i) => (<div key={i} style={{ textAlign: 'center', fontSize: 13, color: C.muted, fontWeight: 700 }}>{d}</div>))}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 6 }}>
        {cells.map((d, i) => {
          if (d === null) return <div key={i} />;
          const key = `${cursor.y}-${String(cursor.m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const info = dayData[key];
          const has = info !== undefined;
          const bg = !has ? C.card2 : info.pnl >= 0 ? `rgba(${C.calPos},${intensity(info.pnl)})` : `rgba(${C.calNeg},${intensity(info.pnl)})`;
          return (
            <div key={i} onClick={() => has && onDayClick(key)} style={{
              aspectRatio: '1.35', borderRadius: 8, background: bg, position: 'relative',
              border: `1px solid ${has ? 'transparent' : C.border}`,
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',

            }}>
              {has && info.hasWarning && (
                <span style={{ position: 'absolute', top: 4, right: 6, fontSize: isDesktop ? 13 : 10 }} title="Tag negativi in questo giorno">⚠️</span>
              )}
              <span style={{ fontSize: isDesktop ? 22 : 16, color: has ? C.text : C.muted, fontWeight: 800, lineHeight: 1 }}>{d}</span>
              {has && (<>
                <span style={{ fontSize: isDesktop ? 17 : 13, fontFamily: 'monospace', fontWeight: 800, color: info.pnl >= 0 ? C.profit : C.loss, marginTop: 4, lineHeight: 1 }}>

              </>)}

          );
        })}
      </div>
    </div>
  );
}

function getTags(trade) {
  if (trade.tags && trade.tags.length) return trade.tags;
  if (trade.strategy && trade.strategy !== 'Non taggato') return [trade.strategy];
  return [];
}

function groupByTags(trades) {
  const map = {};
  trades.forEach(t => {
    const tags = getTags(t);
    const keys = tags.length ? tags : ['Non taggato'];
    keys.forEach(k => (map[k] = map[k] || []).push(t));
  });
  return Object.entries(map).map(([tag, list]) => {
    const n = list.length;
    const wins = list.filter(isWin);
    const losses = list.filter(t => !isWin(t));
    const totalPnl = list.reduce((s, t) => s + t.pnl, 0);
    const winrate = n ? wins.length / n : 0;
    const avgWin = wins.length ? wins.reduce((s, t) => s + t.pnl, 0) / wins.length : 0;
    const avgLoss = losses.length ? Math.abs(losses.reduce((s, t) => s + t.pnl, 0) / losses.length) : 0;
    const pf = avgLoss > 0 && losses.length ? (avgWin * wins.length) / (avgLoss * losses.length) : 0;
    return { tag, n, totalPnl, winrate, avgPnl: n ? totalPnl / n : 0, pf };
  }).sort((a, b) => b.totalPnl - a.totalPnl);
}

function compressImage(file, maxWidth = 1400, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = async () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(async (blob) => {
          try {
            const filename = `${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
            const { error } = await sb.storage
              .from('journal-screenshots')
              .upload(filename, blob, { contentType: 'image/jpeg' });
            if (error) { reject(error); return; }
            const { data } = sb.storage.from('journal-screenshots').getPublicUrl(filename);
            resolve(data.publicUrl);
          } catch (err) { reject(err); }
        }, 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

      ) : (
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <img src={value} onClick={() => setZoomOpen(true)} alt="chart" style={{ maxHeight: maxH, height: 'auto', borderRadius: 6, border: `1px solid ${C.border}`, cursor: 'zoom-in', display: 'block' }} />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            <label style={{ fontSize: 13, color: C.accent, cursor: 'pointer', fontWeight: 700 }}>
              Sostituisci<input type="file" accept="image/*" style={{ display: 'none' }} onChange={e => handleFile(e.target.files[0])} />
            </label>
            <span onClick={() => onChange(null)} style={{ fontSize: 13, color: C.loss, cursor: 'pointer', fontWeight: 700 }}>Rimuovi</span>
          </div>
        </div>
      )}
      {zoomOpen && (
        <div onClick={() => setZoomOpen(false)} style={{ position: 'fixed', inset: 0, zIndex: 300, background: 'rgba(0,0,0,0.8)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'zoom-out', padding: 20 }}>
          <img src={value} alt="chart" style={{ maxWidth: '95%', maxHeight: '95%', borderRadius: 8 }} />
        </div>
      )}
    </div>
  );
}

// FORM AGGIUNTA TRADE
// ════════════════════════════════════════════════════════════
function AddTradeForm({ onAddTrade, onAddNote, allTags = [], onClose, isDesktop }) {
  const [mode, setMode] = useState('quick');
  const emptyForm = { date: '', ticker: '', side: 'short', entryPrice: '', exitPrice: '', pnl: '', locateCost: '', commission: '', notes: '', time: '', size: '', pips: ''};
  const [f, setF] = useState(emptyForm);
  const [tags, setTags] = useState([]);
  const [journal, setJournal] = useState({});
  const [chartImage, setChartImage] = useState(null);

  const reset = () => { setF(emptyForm); setTags([]); setJournal({}); setChartImage(null); setMode('quick'); if (onClose) onClose(); };

  const submitFull = () => {
    if (!f.date || !f.ticker || f.pnl === '') return;
    onAddTrade({
      id: uuid(), date: f.date, ticker: f.ticker.toUpperCase(), tags, side: f.side,
      entryPrice: f.entryPrice ? Number(f.entryPrice) : null,
      exitPrice: f.exitPrice ? Number(f.exitPrice) : null,
      time: f.time || null, pnl: Number(f.pnl),
      locateCost: f.locateCost ? Number(f.locateCost) : 0,
      commission: f.commission ? Number(f.commission) : 0,
      size: f.size ? Number(f.size) : null,
      pips: f.pips !== '' ? Number(f.pips) : null,
      notes: f.notes, journal, chartImage,
    });
    reset();
  };
  const submitQuick = () => {
    if (!f.date || !f.ticker) return;
    onAddNote({ id: uuid(), date: f.date, ticker: f.ticker.toUpperCase(), notes: f.notes, journal, chartImage, used: false });
    reset();
  };

  const inputStyle = { background: C.card2, border: `1px solid ${C.border}`, color: C.text, borderRadius: 6, padding: '9px 12px', fontSize: 14, fontFamily: 'inherit', width: '100%' };
  const labelStyle = { fontSize: 12, color: C.muted, marginBottom: 5, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.04em' };

  return (
    <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: isDesktop ? 22 : 14, display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ display: 'flex', gap: 6 }}>
          {[['quick', '⚡ Solo nota (pre-import)'], ['full', '📄 Trade completo']].map(([v, l]) => (
            <button key={v} onClick={() => setMode(v)} style={{ padding: '8px 14px', borderRadius: 6, cursor: 'pointer', fontSize: 13, fontWeight: 700, border: `1px solid ${mode === v ? C.accent : C.border}`, background: mode === v ? `${C.accent}15` : C.card2, color: mode === v ? C.accent : C.muted }}>{l}</button>
          ))}
        </div>
        <button onClick={reset} title="Chiudi" style={{ width: 32, height: 32, borderRadius: 6, border: `1px solid ${C.border}`, background: C.card2, color: C.muted, cursor: 'pointer', fontSize: 16 }}>✕</button>
      </div>

      {mode === 'quick' ? (
        <>
          <div style={{ display: 'grid', gridTemplateColumns: isDesktop ? '160px 140px 1fr' : '1fr 1fr', gap: 14, alignItems: 'end' }}>
            <div><div style={labelStyle}>Data</div><input type="date" value={f.date} onChange={e => setF({ ...f, date: e.target.value })} style={inputStyle} /></div>
            <div><div style={labelStyle}>Ticker</div><input type="text" value={f.ticker} onChange={e => setF({ ...f, ticker: e.target.value.toUpperCase() })} style={inputStyle} /></div>
            <div style={{ gridColumn: isDesktop ? 'auto' : '1 / -1' }}>
              <div style={labelStyle}>Screenshot</div>
              <ChartImageInput value={chartImage} onChange={setChartImage} inline />
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: isDesktop ? '1fr 1fr' : '1fr', gap: 16 }}>
            <JournalFields journal={journal} onChange={setJournal} />
            <div>
              <div style={labelStyle}>Note libere</div>
              <textarea value={f.notes} onChange={e => setF({ ...f, notes: e.target.value })} rows={isDesktop ? 10 : 4} placeholder="Scrivi qui le tue sensazioni sul trade…" style={{ ...inputStyle, resize: 'vertical', lineHeight: 1.55, minHeight: isDesktop ? 240 : 100 }} />
            </div>
          </div>
        </>
      ) : (
        <>
          <div style={{ display: 'grid', gridTemplateColumns: isDesktop ? 'repeat(4, 1fr)' : 'repeat(2, 1fr)', gap: 14 }}>
            <div><div style={labelStyle}>Data</div><input type="date" value={f.date} onChange={e => setF({ ...f, date: e.target.value })} style={inputStyle} /></div>
            <div><div style={labelStyle}>Ticker</div><input type="text" value={f.ticker} onChange={e => setF({ ...f, ticker: e.target.value.toUpperCase() })} style={inputStyle} /></div>
            <div><div style={labelStyle}>Ora entry</div><input type="time" value={f.time} onChange={e => setF({ ...f, time: e.target.value })} style={inputStyle} /></div>
            <div>
              <div style={labelStyle}>Side</div>
              <div style={{ display: 'flex', gap: 6 }}>
                {['short', 'long'].map(s => (
                  <button key={s} onClick={() => setF({ ...f, side: s })} style={{ flex: 1, padding: '9px 12px', borderRadius: 6, fontSize: 13, fontWeight: 700, cursor: 'pointer', border: `1px solid ${f.side === s ? C.accent : C.border}`, background: f.side === s ? `${C.accent}18` : C.card2, color: f.side === s ? C.accent : C.muted }}>{s === 'short' ? 'Short' : 'Long'}</button>
                ))}
              </div>
            </div>
            <div><div style={labelStyle}>Entry $</div><input type="number" value={f.entryPrice} onChange={e => setF({ ...f, entryPrice: e.target.value })} style={inputStyle} /></div>
            <div><div style={labelStyle}>Exit $</div><input type="number" value={f.exitPrice} onChange={e => setF({ ...f, exitPrice: e.target.value })} style={inputStyle} /></div>
            <div><div style={labelStyle}>PnL netto $</div><input type="number" value={f.pnl} onChange={e => setF({ ...f, pnl: e.target.value })} style={inputStyle} /></div>
            <div><div style={labelStyle}>Locate $</div><input type="number" value={f.locateCost} onChange={e => setF({ ...f, locateCost: e.target.value })} style={inputStyle} placeholder="0" /></div>
            <div><div style={labelStyle}>Commissioni $</div><input type="number" value={f.commission} onChange={e => setF({ ...f, commission: e.target.value })} style={inputStyle} placeholder="0" /></div>
            <div><div style={labelStyle}>Size</div><input type="number" value={f.size} onChange={e => setF({ ...f, size: e.target.value })} style={inputStyle} placeholder="lotti / azioni" /></div>
            <div><div style={labelStyle}>Pips</div><input type="number" value={f.pips} onChange={e => setF({ ...f, pips: e.target.value })} style={inputStyle} placeholder="solo cTrader" /></div>
            <div style={{ gridColumn: '1 / -1' }}>
              <div style={labelStyle}>Screenshot</div>
              <ChartImageInput value={chartImage} onChange={setChartImage} inline />
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: isDesktop ? '1fr 1fr' : '1fr', gap: 16 }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              <div><div style={labelStyle}>Tag / Setup</div><TagInput tags={tags} onChange={setTags} suggestions={allTags} /></div>
              <JournalFields journal={journal} onChange={setJournal} />
            </div>
            <div>
              <div style={labelStyle}>Note libere</div>
              <textarea value={f.notes} onChange={e => setF({ ...f, notes: e.target.value })} rows={isDesktop ? 10 : 4} placeholder="Scrivi qui le tue riflessioni…" style={{ ...inputStyle, resize: 'vertical', lineHeight: 1.55, minHeight: isDesktop ? 240 : 100 }} />
            </div>
          </div>
        </>
      )}

      <div style={{ display: 'flex', gap: 8 }}>
        <button onClick={mode === 'full' ? submitFull : submitQuick} style={{ padding: '9px 20px', borderRadius: 6, border: 'none', background: C.profit, color: C.onAccent, fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>Salva {mode === 'quick' ? 'nota' : 'trade'}</button>
        <button onClick={reset} style={{ padding: '9px 20px', borderRadius: 6, border: `1px solid ${C.border}`, background: 'transparent', color: C.muted, fontSize: 13, cursor: 'pointer' }}>Annulla</button>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// TRADE LOG
// ════════════════════════════════════════════════════════════
function TradeLog({ trades, onUpdate, onDelete, onDuplicate, allTags = [], isDesktop }) {
  const [expandedId, setExpandedId] = useState(null);
  const [noteDraft, setNoteDraft] = useState('');
  const [tagsDraft, setTagsDraft] = useState([]);
  const [journalDraft, setJournalDraft] = useState({});
  const [chartImageDraft, setChartImageDraft] = useState(null);

  const sorted = useMemo(() => [...trades].sort((a, b) => a.date.localeCompare(b.date)), [trades]);
  const equityCurve = useMemo(() => {
    let cum = 0;
    return sorted.map((t, i) => { cum += t.pnl; return { index: i + 1, value: cum, pnl: t.pnl, date: t.date, ticker: t.ticker }; });
  }, [sorted]);

  const chartData = useMemo(() => {
    if (equityCurve.length < 2) return equityCurve;
    return equityCurve.map((p, i) => {
      const row = { ...p };
      for (let j = 0; j < equityCurve.length - 1; j++) row[`seg${j}`] = (i === j || i === j + 1) ? p.value : null;
      return row;
    });
  }, [equityCurve]);

  const segments = useMemo(() => {
    const out = [];
    for (let j = 0; j < equityCurve.length - 1; j++) out.push({ key: `seg${j}`, color: equityCurve[j + 1].pnl >= 0 ? C.profit : C.loss });
    return out;
  }, [equityCurve]);

  const toggleExpand = t => {
    if (expandedId === t.id) { setExpandedId(null); return; }
    setExpandedId(t.id);
    setNoteDraft(t.notes || '');
    setTagsDraft(getTags(t));
    setJournalDraft(t.journal || {});
    setChartImageDraft(t.chartImage || null);
  };

  const saveNote = t => { onUpdate({ ...t, notes: noteDraft, tags: tagsDraft, journal: journalDraft, chartImage: chartImageDraft }); };

  const renderEquityDot = (props) => {
    const { cx, cy, payload, key } = props;
    if (cx == null || cy == null || !payload || payload.value == null) return null;
    const color = payload.pnl >= 0 ? C.profit : C.loss;
    return <circle key={key} cx={cx} cy={cy} r={4} fill={color} stroke={C.card} strokeWidth={1.2} />;
  };

  const rowPad = isDesktop ? '16px 22px' : '12px 16px';
  const W_DATE = isDesktop ? 100 : 80;
  const W_TICKER = isDesktop ? 80 : 60;
  const W_NUM = isDesktop ? 82 : 0;
  const W_PNL = isDesktop ? 90 : 78;
  const numLabelStyle = { fontSize: 10, color: C.muted, textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 2, fontWeight: 700 };
  const numValStyle = { fontSize: 14, fontWeight: 700, fontFamily: 'monospace', lineHeight: 1 };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: isDesktop ? '20px 22px' : '14px 16px' }}>
        <div style={{ fontSize: 12, color: C.muted, textTransform: 'uppercase', letterSpacing: '.07em', marginBottom: 12, fontWeight: 700 }}>
          Equity curve <span style={{ color: C.profit }}>●</span> vincente <span style={{ color: C.loss, marginLeft: 8 }}>●</span> perdente
        </div>
        {equityCurve.length > 1 ? (
          <ResponsiveContainer width="100%" height={isDesktop ? 210 : 160}>
            <AreaChart data={chartData} margin={{ top: 8, right: 8, bottom: 4, left: 0 }}>
              <XAxis dataKey="index" tick={{ fontSize: 11, fill: C.muted }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fontSize: 11, fill: C.muted }} axisLine={false} tickLine={false} tickFormatter={v => v + CUR} width={50} />
              <Tooltip contentStyle={{ background: C.card2, border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 13 }}
                formatter={(v) => [Number(v).toFixed(0) + CUR, 'Equity']}
                labelFormatter={(label, payload) => {
                  if (payload && payload[0]) { const p = payload[0].payload; return `#${p.index} · ${p.ticker} · ${p.pnl >= 0 ? '+' : ''}${p.pnl.toFixed(0)}${CUR}`; }
                  return `Trade #${label}`;
                }} />
              <ReferenceLine y={0} stroke={C.border} strokeDasharray="4 4" />
              <Area type="linear" dataKey="value" stroke="transparent" strokeWidth={0} fill="none" dot={renderEquityDot} isAnimationActive={false} />
              {segments.map(s => (<Area key={s.key} type="linear" dataKey={s.key} stroke={s.color} strokeWidth={2.5} fill={s.color} fillOpacity={0.13} dot={false} activeDot={false} isAnimationActive={false} connectNulls={false} baseValue={0} />))}
            </AreaChart>
          </ResponsiveContainer>
        ) : (
          <div style={{ fontSize: 14, color: C.muted, padding: '20px 0', textAlign: 'center' }}>Aggiungi almeno 2 trade per vedere la curva</div>
        )}
      </div>

      <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, overflow: 'hidden' }}>
        <div style={{ padding: isDesktop ? '14px 22px' : '12px 16px', background: C.card2, fontSize: 12, color: C.muted, textTransform: 'uppercase', letterSpacing: '.07em', fontWeight: 700 }}>
          Trade ({sorted.length})
        </div>
        {sorted.length === 0 && (<div style={{ padding: 20, textAlign: 'center', fontSize: 14, color: C.muted }}>Nessun trade registrato</div>)}
        {[...sorted].reverse().map(t => {
          const locate = getLocateCost(t);
          const commission = getCommission(t);
          const pips = getPips(t);
          const warningTags = getWarningTags(t);
          const hasWarning = warningTags.length > 0;
          return (
            <div key={t.id} style={{ borderTop: `1px solid ${C.border}` }}>
              <div onClick={() => toggleExpand(t)} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: rowPad, cursor: 'pointer' }}>
                <span style={{ fontSize: isDesktop ? 14 : 12, color: C.muted, width: W_DATE, flexShrink: 0, fontFamily: 'monospace' }}>{t.date}</span>
                <span style={{ fontSize: isDesktop ? 17 : 13, fontWeight: 800, color: C.text, width: W_TICKER, flexShrink: 0 }}>{t.ticker}</span>
                <span style={{ fontSize: 11, fontWeight: 800, padding: '3px 8px', borderRadius: 4, flexShrink: 0, width: 58, textAlign: 'center', background: t.side === 'short' ? 'rgba(255,138,128,0.15)' : 'rgba(95,216,143,0.15)', color: t.side === 'short' ? C.loss : C.profit }}>{t.side === 'short' ? 'SHORT' : 'LONG'}</span>
                {(() => {
                  const eTag = t.journal?.eventTags?.[0];
                  if (!eTag) return null;
                  const positive = POSITIVE_EVENT_TAGS.includes(eTag);
                  return (
                    <span style={{
                      fontSize: 11, fontWeight: 700, padding: '3px 9px', borderRadius: 8, flexShrink: 0,
                      background: positive ? 'rgba(95,216,143,0.15)' : 'rgba(255,138,128,0.15)',
                      color: positive ? C.profit : C.loss, whiteSpace: 'nowrap',
                    }}>{eTag}</span>
                  );
                })()}
                <div style={{ display: 'flex', gap: 4, flex: 1, overflow: 'hidden', minWidth: 0 }}>
                  {getTags(t).slice(0, isDesktop ? 2 : 1).map(tag => (<span key={tag} style={{ fontSize: 11, fontWeight: 700, padding: '3px 9px', borderRadius: 8, background: `${C.accent}18`, color: C.accent, whiteSpace: 'nowrap' }}>{tag}</span>))}
                  {getTags(t).length > (isDesktop ? 2 : 1) && <span style={{ fontSize: 11, color: C.muted }}>+{getTags(t).length - (isDesktop ? 2 : 1)}</span>}
                </div>
                {isDesktop && (<>
                  <div style={{ width: W_NUM, textAlign: 'right', flexShrink: 0 }}><div style={numLabelStyle}>Entry</div><div style={{ ...numValStyle, color: C.text }}>{t.entryPrice != null ? `$${t.entryPrice.toFixed(2)}` : '—'}</div></div>
                  <div style={{ width: W_NUM, textAlign: 'right', flexShrink: 0 }}><div style={numLabelStyle}>Exit</div><div style={{ ...numValStyle, color: C.text }}>{t.exitPrice != null ? `$${t.exitPrice.toFixed(2)}` : '—'}</div></div>
                  <div style={{ width: 92, textAlign: 'right', flexShrink: 0 }}><div style={numLabelStyle}>Size</div><div style={{ ...numValStyle, color: C.text }}>{fmtSize(t)}</div></div>
                  <div style={{ width: 70, textAlign: 'right', flexShrink: 0 }}><div style={numLabelStyle}>Pips</div><div style={{ ...numValStyle, color: pips == null ? C.muted : pips >= 0 ? C.profit : C.loss }}>{fmtPips(t)}</div></div>
                  <div style={{ width: W_NUM, textAlign: 'right', flexShrink: 0 }}><div style={numLabelStyle}>Locate</div><div style={{ ...numValStyle, color: locate > 0 ? C.loss : C.muted }}>{locate > 0 ? `-$${locate.toFixed(2)}` : '$0.00'}</div></div>
                  <div style={{ width: W_NUM, textAlign: 'right', flexShrink: 0 }}><div style={numLabelStyle}>Comm</div><div style={{ ...numValStyle, color: commission > 0 ? C.loss : C.muted }}>{commission > 0 ? `-$${commission.toFixed(2)}` : '$0.00'}</div></div>
                </>)}
                <div style={{ width: 22, flexShrink: 0, textAlign: 'center' }}>{t.chartImage && <span style={{ fontSize: 14 }} title="Ha uno screenshot">📷</span>}</div>
                <div style={{ width: 22, flexShrink: 0, textAlign: 'center' }}>{hasWarning && <span style={{ fontSize: 14, cursor: 'help' }} title={`Esecuzione da migliorare: ${warningTags.join(', ')}`}>⚠️</span>}</div>
                <span style={{ fontSize: isDesktop ? 18 : 14, fontWeight: 800, fontFamily: 'monospace', color: t.pnl >= 0 ? C.profit : C.loss, flexShrink: 0, width: W_PNL, textAlign: 'right' }}>{fmt$(t.pnl)}</span>
                <span style={{ color: C.muted, fontSize: 13, flexShrink: 0, width: 16, textAlign: 'center' }}>{expandedId === t.id ? '▲' : '▼'}</span>
              </div>

              {expandedId === t.id && (
                <div style={{ padding: isDesktop ? '22px 24px 24px' : '14px 16px 16px', background: C.card2 }}>
                  {!isDesktop && (t.entryPrice != null || t.exitPrice != null || getSize(t) != null || pips != null || locate > 0 || commission > 0) && (
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 16, fontSize: 14, fontFamily: 'monospace', marginBottom: 16, padding: '12px 14px', background: C.card, borderRadius: 8, border: `1px solid ${C.border}` }}>
                      {t.entryPrice != null && <span style={{ color: C.muted }}>Entry <b style={{ color: C.text }}>${t.entryPrice.toFixed(2)}</b></span>}
                      {t.exitPrice != null && <span style={{ color: C.muted }}>Exit <b style={{ color: C.text }}>${t.exitPrice.toFixed(2)}</b></span>}
                      {getSize(t) != null && <span style={{ color: C.muted }}>Size <b style={{ color: C.text }}>{fmtSize(t)}</b></span>}
                      {pips != null && <span style={{ color: C.muted }}>Pips <b style={{ color: pips >= 0 ? C.profit : C.loss }}>{fmtPips(t)}</b></span>}
                      <span style={{ color: C.muted }}>Locate <b style={{ color: locate > 0 ? C.loss : C.muted }}>-${locate.toFixed(2)}</b></span>
                      <span style={{ color: C.muted }}>Comm <b style={{ color: commission > 0 ? C.loss : C.muted }}>-${commission.toFixed(2)}</b></span>
                    </div>
                  )}
                  <div style={{ display: 'grid', gridTemplateColumns: isDesktop ? '1fr 1fr' : '1fr', gap: isDesktop ? 20 : 14, alignItems: 'start' }}>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                      <ChartImageInput value={chartImageDraft} onChange={setChartImageDraft} small />
                      <div>
                        <div style={{ fontSize: 13, color: C.accent, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 8 }}>📝 Note libere</div>
                        <textarea value={noteDraft} onChange={e => setNoteDraft(e.target.value)} rows={isDesktop ? 9 : 4} placeholder="Scrivi qui le tue riflessioni sul trade…"
                          style={{ background: C.card, border: `1px solid ${C.border}`, color: C.text, borderRadius: 8, padding: isDesktop ? '14px 16px' : '10px 12px', fontSize: isDesktop ? 14 : 13, width: '100%', resize: 'vertical', fontFamily: 'inherit', lineHeight: 1.55, minHeight: isDesktop ? 200 : 90 }} />
                      </div>
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                      <div><div style={{ fontSize: 12, color: C.muted, marginBottom: 6 }}>Tag / Setup</div><TagInput tags={tagsDraft} onChange={setTagsDraft} suggestions={allTags} /></div>
                      <JournalFields journal={journalDraft} onChange={setJournalDraft} />
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 8, marginTop: 16, flexWrap: 'wrap' }}>
                    <button onClick={() => saveNote(t)} style={{ padding: '9px 18px', borderRadius: 6, border: 'none', background: C.accent, color: C.onAccent, fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>Salva</button>
                    <button onClick={() => onDuplicate(t)} style={{ padding: '9px 18px', borderRadius: 6, border: `1px solid ${C.border}`, background: 'transparent', color: C.text, fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>⧉ Duplica trade</button>
                    <button onClick={() => onDelete(t.id)} style={{ padding: '9px 18px', borderRadius: 6, border: `1px solid ${C.loss}55`, background: 'transparent', color: C.loss, fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>Elimina trade</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

const CHECKLIST_ITEMS = ['Rispettato il risk management', 'Seguito il piano di trading', 'Evitato revenge trading', 'Journaling completo dei trade'];

function ImageLightbox({ src, onClose }) {
  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, zIndex: 500,
      background: 'rgba(0,0,0,0.88)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: 24, cursor: 'zoom-out',
    }}>

    </div>
  );
}

function TagBarCard({ title, rows }) {
  if (!rows.length) return null;
  const maxAbs = Math.max(...rows.map(r => Math.abs(r.totalPnl)), 1);
  return (
    <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: 18 }}>
      <div style={{ fontSize: 12, color: C.muted, textTransform: 'uppercase', letterSpacing: '.07em', marginBottom: 14, fontWeight: 700 }}>{title}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        {rows.map(r => (
          <div key={r.tag}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 5 }}>
              <span style={{ width: 150, fontSize: 13, color: C.text, flexShrink: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.tag}</span>
              <div style={{ flex: 1, height: 8, background: C.border, borderRadius: 4, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${(Math.abs(r.totalPnl) / maxAbs) * 100}%`, background: r.totalPnl >= 0 ? C.profit : C.loss, borderRadius: 4 }} />
              </div>
              <span style={{ width: 70, textAlign: 'right', fontSize: 13, fontWeight: 700, fontFamily: 'monospace', color: r.totalPnl >= 0 ? C.profit : C.loss, flexShrink: 0 }}>{fmt$(r.totalPnl)}</span>
            </div>
            <div style={{ fontSize: 11, color: C.muted, marginLeft: 160 }}>×{r.n} · WR {(r.winrate * 100).toFixed(0)}%</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function WeeklyReview({ trades, reviews, onSaveReview, isDesktop }) {
  const [expandedWeek, setExpandedWeek] = useState(null);
  const [draft, setDraft] = useState(null);

  const weeks = useMemo(() => {
    const map = {};
    trades.forEach(t => {
      const wk = getMonday(t.date);
      if (!map[wk]) map[wk] = [];
      map[wk].push(t);
    });
    return Object.entries(map)
      .map(([wk, wtrades]) => {
        const pnl = wtrades.reduce((s, t) => s + t.pnl, 0);
        const wins = wtrades.filter(isWin).length;
        return { weekKey: wk, trades: wtrades, pnl, count: wtrades.length, winrate: wtrades.length ? wins / wtrades.length : 0 };
      })
      .sort((a, b) => b.weekKey.localeCompare(a.weekKey));
  }, [trades]);

  const tagJournalStats = (field) => {
    const map = {};
    trades.forEach(t => { (t.journal?.[field] || []).forEach(tag => { (map[tag] = map[tag] || []).push(t); }); });
    return Object.entries(map).map(([tag, list]) => {
      const n = list.length;
      const winrate = n ? list.filter(isWin).length / n : 0;
      const totalPnl = list.reduce((s, t) => s + t.pnl, 0);
      return { tag, n, winrate, avgPnl: n ? totalPnl / n : 0, totalPnl };
    }).sort((a, b) => b.totalPnl - a.totalPnl);
  };
  const entryStats = useMemo(() => tagJournalStats('entryTags'), [trades]);
  const eventStats = useMemo(() => tagJournalStats('eventTags'), [trades]);

  const insight = useMemo(() => {
    const candidates = [...entryStats, ...eventStats].filter(s => s.n >= 3 && s.avgPnl < 0);
    if (!candidates.length) return null;
    const worst = candidates.reduce((a, b) => (b.avgPnl < a.avgPnl ? b : a));
    return `Il tag "${worst.tag}" ti costa in media ${fmt$(worst.avgPnl)}/trade su ${worst.n} occorrenze.`;
  }, [entryStats, eventStats]);

  const openWeek = w => {
    if (expandedWeek === w.weekKey) { setExpandedWeek(null); return; }
    setExpandedWeek(w.weekKey);
    const existing = reviews[w.weekKey] || { rating: null, notes: '', checklist: {} };
    setDraft({ ...existing });
  };

  const save = weekKey => { onSaveReview(weekKey, draft); };

  const isReviewSaved = (r) => {
    if (!r) return false;
    if (r.rating != null) return true;
    if (r.notes && r.notes.trim()) return true;
    if (r.checklist && Object.values(r.checklist).some(v => v)) return true;
    return false;
  };

  if (weeks.length === 0) return (
    <div style={{ background: C.card, border: `1px dashed ${C.border}`, borderRadius: 12, padding: 30, textAlign: 'center', color: C.muted, fontSize: 14 }}>
      Nessuna settimana da revisionare ancora — aggiungi qualche trade
    </div>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      {insight && (
        <div style={{
          background: 'rgba(164,230,255,0.06)', border: '1px solid rgba(164,230,255,0.25)',
          borderRadius: 10, padding: '12px 16px', fontSize: 13, color: C.accent,
        }}>💡 {insight}</div>
      )}

      {(entryStats.length > 0 || eventStats.length > 0) && (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(380px, 1fr))', gap: 14 }}>
          <TagBarCard title="Perché sei entrato → PnL" rows={entryStats} />
          <TagBarCard title="Cosa è successo → PnL" rows={eventStats} />
        </div>
      )}

      {weeks.map(w => {
        const rev = reviews[w.weekKey];
        const isOpen = expandedWeek === w.weekKey;
        const saved = isReviewSaved(rev);
        return (
          <div key={w.weekKey} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, overflow: 'hidden' }}>
            <div onClick={() => openWeek(w)} style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '16px 22px', cursor: 'pointer' }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 16, fontWeight: 800, color: C.text }}>{formatWeekRange(w.weekKey)}</div>
                <div style={{ fontSize: 13, color: C.muted, marginTop: 3 }}>{w.count} trade · {(w.winrate * 100).toFixed(0)}% winrate</div>
              </div>
              <span style={{ fontSize: 18, fontWeight: 800, fontFamily: 'monospace', color: w.pnl >= 0 ? C.profit : C.loss }}>{fmt$(w.pnl)}</span>
              {saved && (<span style={{ fontSize: 11, fontWeight: 800, padding: '3px 9px', borderRadius: 6, background: `${C.profit}15`, color: C.profit, border: `1px solid ${C.profit}44` }} title="Revisione salvata">✓ Revisionata</span>)}
              {rev?.rating != null && (<span style={{ fontSize: 13, fontWeight: 800, padding: '4px 11px', borderRadius: 6, background: `${C.yellow}18`, color: C.yellow, border: `1px solid ${C.yellow}44` }}>⭐ {rev.rating}/10</span>)}
              <span style={{ color: C.muted, fontSize: 13 }}>{isOpen ? '▲' : '▼'}</span>
            </div>

            {isOpen && draft && (
              <div style={{ padding: '8px 22px 22px', background: C.card2, display: 'flex', flexDirection: 'column', gap: 16 }}>
                <div>
                  <div style={{ fontSize: 12, color: C.muted, marginBottom: 10, textTransform: 'uppercase', letterSpacing: '.06em', fontWeight: 700 }}>
                    Trade della settimana ({w.trades.length}) — clicca per aprire i dettagli
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    {[...w.trades].sort((a, b) => a.date.localeCompare(b.date)).map(t => (
                      <WeekTradeRow key={t.id} t={t} isDesktop={isDesktop} />
                    ))}
                  </div>
                </div>

                <div>
                  <div style={{ fontSize: 12, color: C.muted, marginBottom: 10, textTransform: 'uppercase', letterSpacing: '.06em', fontWeight: 700 }}>Voto settimana</div>
                  <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                    {Array.from({ length: 10 }, (_, i) => i + 1).map(n => (
                      <button key={n} onClick={() => setDraft({ ...draft, rating: n })} style={{ width: 40, height: 40, borderRadius: 8, cursor: 'pointer', fontSize: 15, fontWeight: 800, border: `1px solid ${draft.rating === n ? C.yellow : C.border}`, background: draft.rating === n ? `${C.yellow}22` : C.card, color: draft.rating === n ? C.yellow : C.muted }}>{n}</button>
                    ))}
                  </div>
                </div>

                <div>
                  <div style={{ fontSize: 12, color: C.muted, marginBottom: 10, textTransform: 'uppercase', letterSpacing: '.06em', fontWeight: 700 }}>Checklist disciplina</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    {CHECKLIST_ITEMS.map(item => (
                      <label key={item} style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 14, color: C.text, cursor: 'pointer', padding: '10px 14px', background: C.card, borderRadius: 8, border: `1px solid ${C.border}` }}>
                        <input type="checkbox" checked={!!draft.checklist?.[item]} style={{ width: 18, height: 18 }} onChange={e => setDraft({ ...draft, checklist: { ...draft.checklist, [item]: e.target.checked } })} />
                        {item}
                      </label>
                    ))}
                  </div>
                </div>

                <div>
                  <div style={{ fontSize: 12, color: C.muted, marginBottom: 10, textTransform: 'uppercase', letterSpacing: '.06em', fontWeight: 700 }}>Note / riflessioni</div>
                  <textarea value={draft.notes} onChange={e => setDraft({ ...draft, notes: e.target.value })} rows={6} placeholder="Cosa ha funzionato? Cosa migliorare la prossima settimana?" style={{ background: C.card, border: `1px solid ${C.border}`, color: C.text, borderRadius: 8, padding: '12px 14px', fontSize: 14, width: '100%', resize: 'vertical', fontFamily: 'inherit', lineHeight: 1.55 }} />
                </div>

                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <button onClick={() => save(w.weekKey)} style={{ padding: '10px 22px', borderRadius: 6, border: 'none', background: C.accent, color: C.onAccent, fontWeight: 800, fontSize: 14, cursor: 'pointer' }}>Salva revisione</button>
                  {saved && (<span style={{ fontSize: 12, color: C.profit, fontWeight: 700 }}>✓ Revisione salvata — riapri questa settimana per rivederla</span>)}
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function PendingNotesList({ notes, onDelete }) {
  const unused = notes.filter(n => !n.used).sort((a, b) => b.date.localeCompare(a.date));
  if (notes.length === 0) return null;
  return (
    <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, overflow: 'hidden' }}>
      <div style={{ padding: '12px 18px', background: C.card2, fontSize: 11, color: C.muted, textTransform: 'uppercase', letterSpacing: '.07em', fontWeight: 700 }}>Note pre-import in attesa di abbinamento ({unused.length})</div>
      {unused.length === 0 && <div style={{ padding: 16, textAlign: 'center', fontSize: 13, color: C.muted }}>Tutte le note sono già state abbinate</div>}
      {unused.map(n => (
        <div key={n.id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 18px', borderTop: `1px solid ${C.border}` }}>
          <span style={{ fontSize: 13, color: C.muted, width: 90, flexShrink: 0, fontFamily: 'monospace' }}>{n.date}</span>
          <span style={{ fontSize: 14, fontWeight: 700, color: C.text, width: 70, flexShrink: 0 }}>{n.ticker}</span>
          {n.chartImage && (<img src={n.chartImage} alt="chart" style={{ height: 36, borderRadius: 4, border: `1px solid ${C.border}`, flexShrink: 0 }} />)}
          <span style={{ fontSize: 13, color: C.text, flex: 1 }}>{(n.journal?.entryTags || []).join(', ') || n.notes || '—'}</span>
          <span onClick={() => onDelete(n.id)} style={{ color: C.muted, cursor: 'pointer', fontSize: 14 }}>✕</span>
        </div>
      ))}
    </div>
  );
}

function ImportPanel({ existingTrades, onImport, pendingNotes, onDeleteNote }) {
  const [source, setSource] = useState('tz');
  const [tradeRows, setTradeRows] = useState(null);
  const [ctRows, setCtRows] = useState(null);
  const [cashRows, setCashRows] = useState(null);
  const [locateMap, setLocateMap] = useState({});
  const [preview, setPreview] = useState([]);
  const [selected, setSelected] = useState({});
  const [error, setError] = useState('');

  const handleFile = (file, kind) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const rows = parseCSV(e.target.result);
        if (kind === 'ctrader') {
          if (!isCTraderCSV(rows)) { setError('Il file non sembra un export cTrader (colonne Simbolo / Orario di chiusura non trovate).'); return; }
          setCtRows(rows);
        }
        else if (kind === 'trades') setTradeRows(rows);
        else { setCashRows(rows); setLocateMap(buildLocateCostMap(rows)); }
        setError('');
      } catch (err) { setError('Errore nel leggere il file: ' + err.message); }
    };
    reader.onerror = () => setError('Impossibile leggere il file selezionato.');
    reader.readAsText(file);
  };

  useEffect(() => {
    const srcRows = source === 'ct' ? ctRows : tradeRows;
    if (!srcRows) { setPreview([]); return; }
    const trips = source === 'ct' ? buildTripsFromCTrader(srcRows) : buildRoundTripsFromTradeHistory(srcRows);
    const notesByKey = {};
    pendingNotes.filter(n => !n.used).forEach(n => { const key = `${n.date}__${n.ticker}`; (notesByKey[key] = notesByKey[key] || []).push(n); });
    const tripIdxsByKey = {};
    trips.forEach((t, i) => { const key = `${t.date}__${t.ticker}`; (tripIdxsByKey[key] = tripIdxsByKey[key] || []).push(i); });
    const matchByIdx = {};
    Object.entries(tripIdxsByKey).forEach(([key, idxs]) => {
      const notes = notesByKey[key] || [];
      const sortedIdxs = [...idxs].sort((ia, ib) => {
        const ta = trips[ia].sortTime || trips[ia].time || '99:99';
        const tb = trips[ib].sortTime || trips[ib].time || '99:99';
        return ta.localeCompare(tb);
      });
      sortedIdxs.forEach((idx, i) => { if (notes[i]) matchByIdx[idx] = notes[i]; });
    });
    const withLocate = trips.map((t, i) => {
      const locateCost = source === 'ct' ? (t.swap || 0) : (locateMap[`${t.date}__${t.ticker}`] || 0);
      const finalPnl = source === 'ct' ? t.pnlFromProceeds : t.pnlFromProceeds - locateCost;
      const isDup = existingTrades.some(e => e.date === t.date && e.ticker === t.ticker && Math.abs((e.entryPrice ?? -999) - (t.entryPrice ?? -998)) < 0.005 && (source !== 'ct' || Math.abs((e.exitPrice ?? -999) - (t.exitPrice ?? -998)) < 0.005));
      const matchedNote = matchByIdx[i] || null;
      return { ...t, locateCost, finalPnl, isDup, matchedNoteId: matchedNote?.id ?? null, matchedNote };
    });
    setPreview(withLocate);
    const initSel = {};
    withLocate.forEach((t, i) => { initSel[i] = !t.isDup; });
    setSelected(initSel);
  }, [source, tradeRows, ctRows, locateMap, existingTrades, pendingNotes]);

  const toggleSel = i => setSelected(s => ({ ...s, [i]: !s[i] }));
  const selectedCount = Object.values(selected).filter(Boolean).length;

  const doImport = () => {
    const toImport = preview.filter((_, i) => selected[i]).map(t => {
      const parts = [];
      if (t.matchedNote?.notes) parts.push(t.matchedNote.notes);
      if (t.openPosition) parts.push('Posizione aperta a fine file');
      return {
        id: uuid(), date: t.date, ticker: t.ticker, tags: [source === 'ct' ? CT_TAG : TZ_TAG], side: t.side,
        entryPrice: t.entryPrice, exitPrice: t.exitPrice, time: t.time || null, pnl: t.finalPnl,
        locateCost: t.locateCost || 0, commission: t.commission || 0,
        size: t.qty != null ? t.qty : null, pips: t.pips != null ? t.pips : null,
        notes: parts.join(' · '),
        journal: { ...(t.matchedNote?.journal || {}), ...(source === 'ct' ? { exitTime: t.exitTime, durationSec: t.durationSec } : {}) },
        chartImage: t.matchedNote?.chartImage || null,
      };
    });
    const usedNoteIds = [...new Set(preview.filter((_, i) => selected[i]).map(t => t.matchedNoteId).filter(Boolean))];
    onImport(toImport, usedNoteIds);
    setTradeRows(null); setCtRows(null); setPreview([]); setSelected({});
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <PendingNotesList notes={pendingNotes} onDelete={onDeleteNote} />
      <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: 18 }}>
        <div style={{ display: 'flex', gap: 8, marginBottom: 14, flexWrap: 'wrap' }}>
          {[['tz', 'TradeZero'], ['ct', 'cTrader']].map(([v, l]) => (
            <button key={v} onClick={() => { setSource(v); setError(''); setSelected({}); }} style={{ padding: '8px 18px', borderRadius: 6, cursor: 'pointer', fontSize: 14, fontWeight: 700, border: '1px solid ' + (source === v ? C.accent : C.border), background: source === v ? C.accent + '15' : C.card2, color: source === v ? C.accent : C.muted }}>{l}</button>
          ))}
        </div>
        <div style={{ fontSize: 12, color: C.muted, textTransform: 'uppercase', letterSpacing: '.07em', marginBottom: 12, fontWeight: 700 }}>Carica file {source === 'ct' ? 'cTrader' : 'TradeZero'}</div>
        {source === 'tz' ? (
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
          <label style={fileLabelStyle}>
            📄 TradeHistory.csv {tradeRows && `✓ (${tradeRows.length} righe)`}

function MultiSelectDropdown({ label, options, selected, onChange, placeholder = 'Tutti', width = 180 }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const onDocClick = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDocClick);
    return () => document.removeEventListener('mousedown', onDocClick);
  }, []);

  const inputStyle = { background: C.card2, border: `1px solid ${C.border}`, color: C.text, borderRadius: 6, padding: '7px 11px', fontSize: 14, height: 36, fontFamily: 'inherit' };
  const labelStyle = { fontSize: 11, color: C.muted, marginBottom: 5, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.05em' };

  const toggle = opt => {
    onChange(selected.includes(opt) ? selected.filter(x => x !== opt) : [...selected, opt]);
  };

  const displayText = selected.length === 0
    ? placeholder
    : selected.length === 1
      ? selected[0]
      : `${selected.length} selezionati`;

  const hasSelection = selected.length > 0;

  return (
    <div ref={ref} style={{ position: 'relative' }}>
      {label && <div style={labelStyle}>{label}</div>}
      <button type="button" onClick={() => setOpen(o => !o)} style={{
        ...inputStyle, width, textAlign: 'left', display: 'flex', justifyContent: 'space-between',
        alignItems: 'center', cursor: 'pointer', color: hasSelection ? C.text : C.muted,
        borderColor: hasSelection ? `${C.accent}66` : C.border,
        background: hasSelection ? `${C.accent}10` : C.card2,
      }}>
        <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{displayText}</span>
        <span style={{ fontSize: 10, marginLeft: 6, color: C.muted }}>{open ? '▲' : '▼'}</span>
      </button>
      {open && (
        <div style={{
          position: 'absolute', top: '100%', left: 0, marginTop: 4, minWidth: width,
          background: C.card2, border: `1px solid ${C.border}`, borderRadius: 8,
          boxShadow: C.shadow, maxHeight: 260, overflowY: 'auto', zIndex: 100,
        }}>
          {options.length === 0 && (<div style={{ padding: 12, fontSize: 13, color: C.muted }}>Nessuna opzione</div>)}
          {options.map(opt => {
            const active = selected.includes(opt);
            return (
              <div key={opt} onClick={() => toggle(opt)} style={{
                display: 'flex', alignItems: 'center', gap: 10, padding: '9px 12px', cursor: 'pointer',
                background: active ? `${C.accent}12` : 'transparent',
              }}>
                <input type="checkbox" checked={active} readOnly style={{ pointerEvents: 'none', width: 15, height: 15 }} />
                <span style={{ fontSize: 14, color: active ? C.text : C.muted }}>{opt}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function groupStats(trades, keyFn, keyOrder = null) {
  const map = {};
  trades.forEach(t => {
    const k = keyFn(t);
    if (k === null || k === undefined) return;
    (map[k] = map[k] || []).push(t);
  });
  const buildRow = (key, list) => {
    const n = list.length;
    const wins = list.filter(isWin).length;
    const totalPnl = list.reduce((s, t) => s + t.pnl, 0);
    return { key, n, winrate: n ? wins / n : 0, avgPnl: n ? totalPnl / n : 0, totalPnl };
  };
  if (keyOrder) return keyOrder.map(k => buildRow(k, map[k] || []));
  return Object.entries(map).map(([key, list]) => buildRow(key, list)).sort((a, b) => b.totalPnl - a.totalPnl);
}

  return (

              <div style={{ display: 'flex', gap: 14, alignItems: 'baseline' }}>
                <span style={{ fontSize: 12, color: C.muted }}>{r.n} tr · WR {(r.winrate * 100).toFixed(0)}%</span>

const WEEKDAY_NAMES = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
const PRICE_ORDER = ['< $1', '$1 - $3', '$3 - $5', '$5 - $10', '$10 - $20', '$20+'];
function priceBucket(price) {
  if (price == null) return null;
  if (price < 1) return '< $1';
  if (price < 3) return '$1 - $3';
  if (price < 5) return '$3 - $5';
  if (price < 10) return '$5 - $10';
  if (price < 20) return '$10 - $20';
  return '$20+';
}
const TIME_ORDER = ['Pre-market', '09:30 - 10:00', '10:00 - 10:30', '10:30 - 11:00', '11:00 - 12:00', '12:00 - 14:00', '14:00 - 16:00', 'After-hours'];
function timeBucket(time) {
  if (!time) return null;
  const [h, m] = time.split(':').map(Number);
  const mins = h * 60 + m;
  if (mins < 9 * 60 + 30) return 'Pre-market';
  if (mins < 10 * 60) return '09:30 - 10:00';
  if (mins < 10 * 60 + 30) return '10:00 - 10:30';
  if (mins < 11 * 60) return '10:30 - 11:00';
  if (mins < 12 * 60) return '11:00 - 12:00';
  if (mins < 14 * 60) return '12:00 - 14:00';
  if (mins <= 16 * 60) return '14:00 - 16:00';
  return 'After-hours';
}

const CT_TIME_ORDER = ['08 - 10', '10 - 12', '12 - 15', '15 - 18', 'Fuori fascia'];
function ctTimeBucket(time) {
  if (!time) return null;
  const h = Number(time.split(':')[0]);
  if (h >= 8 && h < 10) return '08 - 10';
  if (h >= 10 && h < 12) return '10 - 12';
  if (h >= 12 && h < 15) return '12 - 15';
  if (h >= 15 && h < 18) return '15 - 18';
  return 'Fuori fascia';
}
// sceglie la fascia giusta in base al conto
function tradeTimeBucket(t) {
  return getTags(t).includes(CT_TAG) ? ctTimeBucket(t.time) : timeBucket(t.time);
}
// mostra solo le fasce dei conti presenti nei trade filtrati
function timeOrderFor(trades) {
  const ct = trades.some(t => getTags(t).includes(CT_TAG));
  const tz = trades.some(t => !getTags(t).includes(CT_TAG));
  return [...(tz || !ct ? TIME_ORDER : []), ...(ct ? CT_TIME_ORDER : [])];
}

            <div style={{ height: 6, borderRadius: 3, background: C.border, overflow: 'hidden' }}>

function StrategyView({ trades }) {
  const tagRows = useMemo(() => groupByTags(trades), [trades]);
  const bySide = useMemo(() => groupStats(trades, t => t.side === 'short' ? 'Short' : t.side === 'long' ? 'Long' : null), [trades]);
  const byWeekday = useMemo(() => groupStats(trades, t => WEEKDAY_NAMES[(new Date(t.date + 'T00:00:00').getDay() + 6) % 7], WEEKDAY_NAMES), [trades]);
  const byPrice = useMemo(() => groupStats(trades.filter(t => t.entryPrice != null), t => priceBucket(t.entryPrice), PRICE_ORDER), [trades]);
  const withTime = useMemo(() => trades.filter(t => t.time), [trades]);
  const byTime = useMemo(() => groupStats(withTime, tradeTimeBucket, timeOrderFor(withTime)), [trades]);

  if (trades.length === 0) return (
    <div style={{ background: C.card, border: `1px dashed ${C.border}`, borderRadius: 12, padding: 30, textAlign: 'center', color: C.muted, fontSize: 14 }}>Nessun trade da analizzare</div>

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ fontSize: 13, color: C.muted }}>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(420px, 1fr))', gap: 14, alignItems: 'start' }}>

        <BreakdownSection title="Fascia oraria" rows={byTime} note="Nessun orario registrato — aggiungilo nel form trade o dall'import TradeZero" />

  );

function computeKpis(trades) {
  const n = trades.length;
  const wins = trades.filter(isWin);
  const losses = trades.filter(t => !isWin(t));
  const totalPnl = trades.reduce((s, t) => s + t.pnl, 0);
  const avgWin = wins.length ? wins.reduce((s, t) => s + t.pnl, 0) / wins.length : 0;
  const avgLoss = losses.length ? Math.abs(losses.reduce((s, t) => s + t.pnl, 0) / losses.length) : 0;
  const pf = avgLoss > 0 && losses.length ? (avgWin * wins.length) / (avgLoss * losses.length) : 0;
  const byDate = [...trades].sort((a, b) => a.date.localeCompare(b.date));
  const pipsList = trades.map(getPips).filter(p => p != null);
  let cum = 0, peak = 0, maxDD = 0, cw = 0, cl = 0, maxW = 0, maxL = 0;
  byDate.forEach(t => {
    cum += t.pnl;
    if (cum > peak) peak = cum;
    if (cum - peak < maxDD) maxDD = cum - peak;
    if (isWin(t)) { cw++; cl = 0; if (cw > maxW) maxW = cw; }
    else { cl++; cw = 0; if (cl > maxL) maxL = cl; }
  });
  const sorted = [...trades].sort((a, b) => a.pnl - b.pnl);
  return {
    n: n, wins: wins.length, losses: losses.length, totalPnl: totalPnl,
    winrate: n ? wins.length / n : 0, avgWin: avgWin, avgLoss: avgLoss,
    expectancy: n ? totalPnl / n : 0, pf: pf, maxDD: Math.abs(maxDD),
    maxW: maxW, maxL: maxL,
    best: n ? sorted[n - 1] : null, worst: n ? sorted[0] : null,
    locate: trades.reduce((s, t) => s + getLocateCost(t), 0),
    comm: trades.reduce((s, t) => s + getCommission(t), 0),
    pips: pipsList.reduce((s, p) => s + p, 0), pipsN: pipsList.length,
  };
}

function buildExportData(label, trades) {
  const k = computeKpis(trades);
  const r2 = v => Math.round(v * 100) / 100;
  const kpiRows = [
    ['KPI', 'Valore'],
    ['Periodo', label],
    ['Trade totali', k.n],
    ['Win', k.wins],
    ['Loss', k.losses],
    ['Winrate %', r2(k.winrate * 100)],
    ['P&L totale $', r2(k.totalPnl)],
    ['Expectancy $/trade', r2(k.expectancy)],
    ['Profit factor', r2(k.pf)],
    ['Profit medio $', r2(k.avgWin)],
    ['Loss medio $', r2(k.avgLoss)],
    ['Max drawdown $', r2(k.maxDD)],
    ['Miglior trade', k.best ? k.best.ticker + ' ' + r2(k.best.pnl) : '-'],
    ['Peggior trade', k.worst ? k.worst.ticker + ' ' + r2(k.worst.pnl) : '-'],
    ['Max win di fila', k.maxW],
    ['Max loss di fila', k.maxL],
    ['Locate totali $', r2(k.locate)],
    ['Commissioni totali $', r2(k.comm)],
    ['Pips totali', k.pipsN ? r2(k.pips) : '-'],
    ['Pips medi/trade', k.pipsN ? r2(k.pips / k.pipsN) : '-'],
  ];
  const tradeRows = [['Data', 'Ticker', 'Side', 'Ora', 'Entry', 'Exit', 'Size', 'Unità', 'Pips', 'Locate', 'Comm', 'PnL', 'Tag', 'Perche entrato', 'Cosa successo', 'Note']];
  [...trades].sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
    const size = getSize(t);
    const pips = getPips(t);
    tradeRows.push([
      t.date, t.ticker, t.side || '', t.time || '',
      t.entryPrice != null ? r2(t.entryPrice) : '',
      t.exitPrice != null ? r2(t.exitPrice) : '',
      size != null ? r2(size) : '',
      size != null ? (getTags(t).includes(CT_TAG) ? 'lotti' : 'azioni') : '',
      pips != null ? r2(pips) : '',
      r2(getLocateCost(t)), r2(getCommission(t)), r2(t.pnl),
      getTags(t).join(', '),
      (t.journal && t.journal.entryTags ? t.journal.entryTags : []).join(', '),
      (t.journal && t.journal.eventTags ? t.journal.eventTags : []).join(', '),
      t.notes || '',
    ]);
  });
  const tagRows = [['Tag', 'Trade', 'Winrate %', 'PnL totale', 'PnL medio', 'Profit factor']];
  groupByTags(trades).forEach(g => {
    tagRows.push([g.tag, g.n, r2(g.winrate * 100), r2(g.totalPnl), r2(g.avgPnl), r2(g.pf)]);
  });
  return { k: k, kpiRows: kpiRows, tradeRows: tradeRows, tagRows: tagRows };
}

function downloadExcel(key, data) {
  if (!window.XLSX) { alert('Libreria Excel non caricata'); return; }
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(data.kpiRows);
  ws1['!cols'] = [{ wch: 24 }, { wch: 22 }];
  const ws2 = XLSX.utils.aoa_to_sheet(data.tradeRows);
  ws2['!cols'] = [{wch:11},{wch:8},{wch:7},{wch:9},{wch:8},{wch:8},{wch:9},{wch:8},{wch:8},{wch:8},{wch:8},{wch:9},{wch:22},{wch:26},{wch:26},{wch:40}];  const ws3 = XLSX.utils.aoa_to_sheet(data.tagRows);
  ws3['!cols'] = [{ wch: 24 }, { wch: 8 }, { wch: 11 }, { wch: 12 }, { wch: 11 }, { wch: 13 }];
  XLSX.utils.book_append_sheet(wb, ws1, 'KPI');
  XLSX.utils.book_append_sheet(wb, ws2, 'Trade');
  XLSX.utils.book_append_sheet(wb, ws3, 'Per Tag');
  XLSX.writeFile(wb, 'trading-journal-' + key + '.xlsx');
}

function buildAiPrompt(label, trades, reviews, reviewKeys, extra) {
  if (!trades.length) return '';
  const num = v => (v >= 0 ? '+' : '') + v.toFixed(0);
  const pct = v => (v * 100).toFixed(0) + '%';
  const k = computeKpis(trades);
  const isCt = t => getTags(t).includes(CT_TAG);
  const ctN = trades.filter(isCt).length;
  const mixed = ctN > 0 && ctN < trades.length;
  const cur = ctN === trades.length ? '€' : '$';

  let context;
  if (ctN === 0) context = 'Opero short selling su small cap USA in gap-up (conto TradeZero, importi in $).';
  else if (ctN === trades.length) context = 'Opero strategie su CFD indici e oro tramite cTrader (importi in €).';
  else context = 'Opero due conti: short selling su small cap USA in gap-up (TradeZero, $) e strategie su CFD indici e oro (cTrader, €). I trade con tag "' + CT_TAG + '" sono in €, tutti gli altri in $: analizza i due conti separatamente e non sommare le valute.';

  const rowLine = (name, r) => '  - ' + name + ': ' + r.n + ' trade, WR ' + pct(r.winrate) + ', PnL ' + num(r.totalPnl);
  const block = rows => rows.filter(r => r.n > 0).map(r => rowLine(r.key, r)).join('\n') || '  (nessun dato)';

  const tickerMap = {};
  trades.forEach(t => { (tickerMap[t.ticker] = tickerMap[t.ticker] || []).push(t); });
  const tickerLines = Object.entries(tickerMap)
    .map(([tk, list]) => ({ tk: tk, n: list.length, pnl: list.reduce((s, t) => s + t.pnl, 0), wr: list.filter(isWin).length / list.length }))
    .sort((a, b) => b.n - a.n).slice(0, 12)
    .map(r => '  - ' + r.tk + ': ' + r.n + ' trade, WR ' + pct(r.wr) + ', PnL ' + num(r.pnl));

  const tagLines = groupByTags(trades).map(r => '  - ' + r.tag + ': ' + r.n + ' trade, WR ' + pct(r.winrate) + ', PnL ' + num(r.totalPnl) + ', PF ' + r.pf.toFixed(2));

  const journalLines = field => {
    const map = {};
    trades.forEach(t => { ((t.journal && t.journal[field]) || []).forEach(tag => { (map[tag] = map[tag] || []).push(t); }); });
    const out = Object.entries(map).sort((a, b) => b[1].length - a[1].length).map(([tag, list]) =>
      '  - ' + tag + ': x' + list.length + ', WR ' + pct(list.filter(isWin).length / list.length) + ', PnL ' + num(list.reduce((s, t) => s + t.pnl, 0)));
    return out.join('\n') || '  (nessun dato)';
  };

  const bySide = groupStats(trades, t => t.side === 'short' ? 'Short' : t.side === 'long' ? 'Long' : null);
  const byDay = groupStats(trades, t => WEEKDAY_NAMES[(new Date(t.date + 'T00:00:00').getDay() + 6) % 7], WEEKDAY_NAMES);
  const withTime = trades.filter(t => t.time);
  const byTime = groupStats(withTime, tradeTimeBucket, timeOrderFor(withTime));
  
  const reviewLines = reviewKeys.filter(key => reviews[key]).map(key => {
    const r = reviews[key];
    return '  - Settimana ' + formatWeekRange(key) + ': voto ' + (r.rating != null ? r.rating : '-') + '/10' + (r.notes ? ' — "' + r.notes + '"' : '');
  });

  const tradeLines = [...trades].sort((a, b) => a.date.localeCompare(b.date)).map(t =>
    '  ' + t.date + ' | ' + t.ticker + ' | ' + (t.side || '-') + ' | ' + fmtSize(t) + ' | ' + (getPips(t) != null ? fmtPips(t) + ' pip' : '-') + ' | ' +
    (getTags(t).join(', ') || '-') + ' | ' +
    ((t.journal && t.journal.entryTags) || []).join(', ') + ' | ' + ((t.journal && t.journal.eventTags) || []).join(', ') +
    ' | ' + num(t.pnl) + (isCt(t) ? '€' : '$'));

  const data = [
    'KPI GENERALI' + (mixed ? ' (valute miste: totali indicativi)' : ' (' + cur + ')'),
    '  Trade: ' + k.n + ' | Winrate: ' + pct(k.winrate) + ' | PnL: ' + num(k.totalPnl) + ' | Expectancy: ' + num(k.expectancy) + '/trade',
    '  Profit factor: ' + k.pf.toFixed(2) + ' | Profit medio: ' + num(k.avgWin) + ' | Loss medio: -' + k.avgLoss.toFixed(0),
    '  Max drawdown: -' + k.maxDD.toFixed(0) + ' | Max win di fila: ' + k.maxW + ' | Max loss di fila: ' + k.maxL,
    '',
    'PER STRUMENTO (i più negoziati)', tickerLines.join('\n') || '  (nessun dato)',
    '',
    'PER STRATEGIA / TAG / CONTO', tagLines.join('\n') || '  (nessun dato)',
    '',
    'LONG vs SHORT', block(bySide),
    '',
    'PER GIORNO', block(byDay),
    '',
    'PER FASCIA ORARIA (' + withTime.length + ' trade con orario)', block(byTime),
    '',
    'PERCHÉ SONO ENTRATO', journalLines('entryTags'),
    '',
    'COSA È SUCCESSO', journalLines('eventTags'),
  ];
  if (reviewLines.length) data.push('', 'REVISIONI SETTIMANALI', reviewLines.join('\n'));
  data.push('', 'DETTAGLIO TRADE (data | strumento | side | size | pips | tag | perché entrato | cosa è successo | pnl)', tradeLines.join('\n'));
  
  const questions = [
    '1. Per ogni strumento e per ogni tag/conto: dove ho un edge reale (winrate, profit factor, expectancy) e dove no? Tieni separati strumenti e valute.',
    '2. Guardando PERCHÉ SONO ENTRATO: quali setup funzionano e quali vanno evitati o ridotti?',
    '3. Guardando COSA È SUCCESSO: quale errore di esecuzione mi costa di più (frequenza x PnL negativo) e in quale strumento?',
    '4. Ci sono pattern per giorno, fascia oraria o direzione (long/short) legati ai trade in perdita?',
    '5. Gestione del rischio: il rapporto tra loss medio e profit medio, il drawdown e le serie di loss sono coerenti con la strategia? Segnala eventuali anomalie di size.',
    '6. Dammi 2-3 azioni concrete per il prossimo periodo e una regola da testare, indicando quali dati servirebbero per verificarla.',
    'Se il campione di un gruppo è sotto i 30 trade, dillo chiaramente e non trarre conclusioni forti.',
  ];

  return [
    'Sono un trader retail. ' + context,
    'Analizza i miei dati di trading del periodo "' + label + '" e rispondi in modo diretto, con numeri.',
    extra && extra.trim() ? '\nContesto aggiuntivo: ' + extra.trim() : '',
    '\nDOMANDE',
    questions.join('\n'),
    '\nDATI',
    data.join('\n'),
  ].join('\n').trim();
}

function triggerDownload(content, filename, mime = 'text/plain') {
  try {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return true;
  } catch { return false; }
}
